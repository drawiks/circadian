[package]
name = "circadian-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
circadian-core = { path = "../core" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
gpui-kit = "0.10.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
