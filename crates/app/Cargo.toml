[package]
name = "circadian-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
circadian-core = { path = "../core" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
gpui-kit = "0.10.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
semver = "1"
smol = "2"
thiserror = "2"
ureq = "3.5.2"
minisign-verify = "0.3.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
