name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows

      - name: Format
        run: cargo fmt --all --check

      - name: Test
        run: cargo test --locked -p circadian-core -p circadian-app

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Locate fxc
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $fxc) { throw "fxc.exe not found in the Windows SDK" }
          Add-Content -Path $env:GITHUB_ENV -Value "GPUI_FXC_PATH=$($fxc.FullName)"

      - name: Build release
        run: cargo build --locked --release -p circadian-app -p circadian-daemon

      - name: Verify precompiled shaders
        shell: pwsh
        run: |
          $exe = "target\release\circadian-app.exe"
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($exe))
          if ($text.Contains("shaders.hlsl") -or $text.Contains("D3DCompileFromFile")) {
            throw "Release binary contains the runtime shader path; precompiled shaders were not used."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = Get-ChildItem -Path $candidates -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            $command = Get-Command iscc.exe -ErrorAction SilentlyContinue
            if (-not $command) { throw "ISCC.exe not found" }
            $iscc = Get-Item $command.Source
          }
          Add-Content -Path $env:GITHUB_ENV -Value "ISCC=$($iscc.FullName)"

      - name: Resolve version
        shell: pwsh
        run: |
          $meta = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($meta.packages | Where-Object { $_.name -eq "circadian-app" }).version
          Add-Content -Path $env:GITHUB_ENV -Value "APP_VERSION=$version"

      - name: Build installer
        shell: pwsh
        run: |
          & $env:ISCC "/DAppVersion=$env:APP_VERSION" "installer\circadian.iss"

      - name: Smoke-test installer
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "circadian-smoke"
          if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
          $setup = "dist\Circadian-Setup-$env:APP_VERSION.exe"
          $install = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$dir"
          )
          if ($install.ExitCode -ne 0) { throw "installer exited with $($install.ExitCode)" }
          foreach ($name in @("circadian.exe", "circadiand.exe", "unins000.exe")) {
            if (-not (Test-Path (Join-Path $dir $name))) { throw "missing installed file $name" }
          }
          $uninstall = Start-Process -FilePath (Join-Path $dir "unins000.exe") -Wait -PassThru -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          )
          if ($uninstall.ExitCode -ne 0) { throw "uninstaller exited with $($uninstall.ExitCode)" }
          if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }

      - name: Package portable
        shell: pwsh
        run: |
          $portable = Join-Path $env:RUNNER_TEMP "circadian-portable"
          New-Item -ItemType Directory -Force -Path "$portable\assets", "$portable\licenses" | Out-Null
          Copy-Item "target\release\circadian-app.exe" "$portable\circadian.exe"
          Copy-Item "target\release\circadian-daemon.exe" "$portable\circadiand.exe"
          Copy-Item "crates\daemon\assets\circadian.ico" "$portable\assets\circadian.ico"
          Copy-Item "LICENSE" "$portable\LICENSE"
          Copy-Item "README.md" "$portable\README.md"
          Copy-Item "README.ru.md" "$portable\README.ru.md"
          Copy-Item "THIRD_PARTY_NOTICES.md" "$portable\THIRD_PARTY_NOTICES.md"
          Copy-Item "licenses\*" "$portable\licenses\" -Recurse
          tar.exe -a -c -f "dist\Circadian-$env:APP_VERSION-portable.zip" -C $portable .

      - name: Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File | Where-Object { $_.Extension -in ".exe", ".zip" }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Encoding ascii "dist\SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: circadian-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: windows
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release and guard
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as file:
              print(tomllib.load(file)["workspace"]["package"]["version"])
          PY
          )
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

          git fetch origin main --depth=1
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main moved; skipping release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --tags --force
          TAG_EXISTS=false
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_EXISTS=true
            TARGET=$(git rev-list -n1 "$TAG")
            if [ "$TARGET" != "$GITHUB_SHA" ]; then
              echo "::error::tag $TAG already points to $TARGET; bump Cargo.toml version"
              exit 1
            fi
          fi
          echo "tag_exists=$TAG_EXISTS" >> "$GITHUB_OUTPUT"

          DRAFT=false
          if gh release view "$TAG" --json isDraft --jq .isDraft > /tmp/release-draft 2>/dev/null; then
            if [ "$(cat /tmp/release-draft)" = "false" ]; then
              echo "release $TAG is already published; skipping"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            DRAFT=true
          fi
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: steps.meta.outputs.skip != 'true'
        with:
          name: circadian-dist
          path: dist

      - uses: dtolnay/rust-toolchain@master
        if: steps.meta.outputs.skip != 'true'
        with:
          toolchain: 1.98.1

      - name: Install manifest signer
        if: steps.meta.outputs.skip != 'true'
        run: cargo install rsign2 --locked

      - name: Build manifest
        if: steps.meta.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "PUBLISHED_AT=$PUBLISHED_AT" >> "$GITHUB_ENV"
          python3 scripts/update_manifest.py \
            --version "$VERSION" \
            --tag "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dist dist \
            --published-at "$PUBLISHED_AT"

      - name: Sign manifest
        if: steps.meta.outputs.skip != 'true'
        shell: bash
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::error::MINISIGN_SECRET_KEY is not configured"
            exit 1
          fi
          install -m 600 /dev/null "$RUNNER_TEMP/minisign.key"
          printf '%s' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          "$HOME/.cargo/bin/rsign" sign dist/latest.json \
            --secret-key-file "$RUNNER_TEMP/minisign.key" \
            --public-key-file crates/app/assets/minisign.pub \
            --sig-file dist/latest.json.minisig \
            --trusted-comment "circadian stable $VERSION $PUBLISHED_AT" \
            --passwordless
          "$HOME/.cargo/bin/rsign" verify dist/latest.json \
            --public-key-path crates/app/assets/minisign.pub \
            --sig-file dist/latest.json.minisig
          rm -f "$RUNNER_TEMP/minisign.key"

      - name: Create tag
        if: steps.meta.outputs.skip != 'true' && steps.meta.outputs.tag_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Circadian $VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Publish draft release
        if: steps.meta.outputs.skip != 'true'
        shell: bash
        env:
          DRAFT: ${{ steps.meta.outputs.draft }}
        run: |
          set -euo pipefail
          if [ "${DRAFT:-false}" != "true" ]; then
            gh release create "$TAG" \
              --draft \
              --verify-tag \
              --title "Circadian $VERSION" \
              --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false --latest --title "Circadian $VERSION"
